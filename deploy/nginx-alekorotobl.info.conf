# Прямой доступ к серверу (без Cloudflare): HTTP→HTTPS + SSL proxy.
server {
    listen 80;
    listen [::]:80;
    server_name alekorotobl.info;
    return 301 https://alekorotobl.info$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alekorotobl.info;

    ssl_certificate /etc/letsencrypt/live/alekorotobl.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alekorotobl.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
